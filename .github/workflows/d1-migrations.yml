name: Применить миграции D1
# Запускается при изменении папки migrations и вручную. Миграции безопасны для повторного запуска (CREATE ... IF NOT EXISTS).
on:
  push:
    branches: [feat/mila-platform]
    paths: ["migrations/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Применить миграции к боевой базе
        run: npx wrangler d1 migrations apply beauty-os --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
